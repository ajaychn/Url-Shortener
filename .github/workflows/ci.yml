name: CI

"on":
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Build client
        working-directory: client
        run: npm run build

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Build server
        working-directory: server
        run: npm run build

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker images
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/url-shortener-server:latest ./server
           docker build \
            --build-arg VITE_API_URL=${{ vars.VITE_API_URL }} \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/url-shortener-client:latest \
            ./client

      - name: Push Docker images
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/url-shortener-server:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/url-shortener-client:latest

      - name: Deploy server to Render
        run: curl -X POST "${{ secrets.SERVER_DEPLOY_HOOK }}"

      - name: Deploy client to Render
        run: curl -X POST "${{ secrets.CLIENT_DEPLOY_HOOK }}"